<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>OceanEmbed</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #7993ce;
      }

      #root {
        width: 100%;
        min-height: 100%;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #0f172a;
        color: white;

        overflow: hidden;

        font-family: Inter, Arial, sans-serif;

        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
      }

      #boot-message {
        width: 90%;
        max-width: 1200px;

        text-align: center;

        font-size: clamp(2rem, 5vw, 4.5rem);

        font-weight: 700;

        line-height: 1.25;
      }

      #boot-loader.boot-hidden {
        opacity: 0;
        transform: translateY(-100%);
        pointer-events: none;
      }
    </style>
  </head>

  <body>

    <div id="boot-loader">
      <div id="boot-message">
        আপোনাাক আমাৰ ৱেবপেজলৈ স্বাগতম
      </div>
    </div>

    <div id="root"></div>

    <script>
      const bootGreetings = [
        "আপোনাাক আমাৰ ৱেবপেজলৈ স্বাগতম",
        "আমাদের ওয়েবপেজে আপনাকে স্বাগতম",
        "सांतरे वेबपेज पर तुंदा स्वागत ऐ",
        "અમારી વેબપેજ પર આપનું સ્વાગત છે",
        "हमारे वेबपेज पर आपका स्वागत है",
        "ನಮ್ಮ ವೆಬ್‌ಪುಟಕ್ಕೆ ನಿಮಗೆ ಸ್ವಾಗತ",
        "پُنٛنس ویب پۆجس پؠٹھ چھُ توہِہ خوش آمدید",
        "आमच्या वेबपाचेर तुका स्वागत आसा",
        "हमारे वेबपेज पर स्वागत अछि",
        "ഞങ്ങളുടെ വെബ്‌പേജിലേക്ക് സ്വാഗതം",
        "ঐখোয়গী ৱেবপেজদা তরাম্না ওকচরি",
        "आमच्या वेबपेजवर आपले स्वागत आहे",
        "हाम्रो वेबपेजमा तपाईलाई स्वागत छ",
        "ଆମର ୱେବ୍‌ପେଜ୍‌କୁ ସ୍ୱାଗତ",
        "ਸਾਡੇ ਵੈੱਬਪੇਜ 'ਤੇ ਤੁਹਾਡਾ ਸਵਾਗതം ਹੈ",
        "अस्मदीये वेबपुट्जे भवतां स्वागतम्",
        "ᱟᱞᱮᱭᱟᱜ ᱣᱮᱵᱽᱯᱮᱡᱽ ᱨᱮ ᱡᱚᱛᱚ ᱠᱚ ᱜᱮ ᱜᱚᱭᱟᱨ",
        "اسان جي ويب پيج تي اوهان جي مهرباني",
        "எங்கள் வலைப்பக்கத்திற்கு உங்களை வரவேற்கிறோம்",
        "మా వెబ్‌పేజీకి మీకు స్వాగతం",
        "ہمارے ویب صفحے پر خوش آمدید",
        "Welcome to our webpage"
      ];

      const bootMessage = document.getElementById("boot-message");
      let bootIndex = 0;
      const BOOT_INTERVAL = 120;
      let bootTimeout;

      function stepBoot() {
        if (bootIndex < bootGreetings.length - 1) {
          bootIndex++;
          bootMessage.textContent = bootGreetings[bootIndex];
          bootTimeout = setTimeout(stepBoot, BOOT_INTERVAL);
        } else {
          // Linger on the final greeting ("Welcome to our webpage") until React takes over
          bootMessage.textContent = bootGreetings[bootGreetings.length - 1];
        }
      }

      bootTimeout = setTimeout(stepBoot, BOOT_INTERVAL);

      /*
       * React calls this immediately when it is ready
       * to take over the screen.
       */
      window.finishOceanBootLoader = () => {
        clearTimeout(bootTimeout);

        const loader = document.getElementById("boot-loader");

        if (!loader) return;

        loader.classList.add("boot-hidden");

        setTimeout(() => {
          loader.remove();
        }, 850);
      };
    </script>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
