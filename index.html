<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>OceanEmbed — Marine Intelligence</title>
    <meta
      name="description"
      content="OceanEmbed — interactive ocean forecasting: live temperature profiles, surface parameters and heatmaps for the North Indian Ocean."
    />
    <meta name="theme-color" content="#06283d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #06283d;
      }

      #root {
        width: 100%;
        min-height: 100%;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;

        display: flex;
        align-items: center;
        justify-content: center;

        background: linear-gradient(180deg, #132730 0%, #0d1b21 60%, #0a1419 100%);
        color: #F7F4ED;

        overflow: hidden;

        font-family: Sora, Inter, Arial, sans-serif;

        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
      }

      #boot-loader.boot-hidden {
        opacity: 0;
        transform: translateY(-100%);
        pointer-events: none;
      }

      /* ---- animated ocean scene ---- */
      .boot-ocean {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .boot-glow {
        position: absolute;
        left: 50%;
        top: 34%;
        width: 520px;
        height: 520px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(12, 110, 94, 0.28) 0%, transparent 70%);
        animation: bootGlowPulse 3s ease-in-out infinite;
      }

      @keyframes bootGlowPulse {
        0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
      }

      .boot-sonar {
        position: absolute;
        left: 50%;
        top: 34%;
        width: 120px;
        height: 120px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 2px solid rgba(247, 244, 237, 0.35);
        animation: bootSonar 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      .boot-sonar.s2 { animation-delay: 0.7s; }
      .boot-sonar.s3 { animation-delay: 1.4s; }

      @keyframes bootSonar {
        0% { transform: translate(-50%, -50%) scale(0.45); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
      }

      .boot-pin {
        position: absolute;
        left: 50%;
        top: 34%;
        transform: translate(-50%, -62%);
        font-size: 54px;
        line-height: 1;
        color: #F7F4ED;
        filter: drop-shadow(0 0 18px rgba(12, 110, 94, 0.9));
        animation: bootBob 2.2s ease-in-out infinite;
      }

      @keyframes bootBob {
        0%, 100% { transform: translate(-50%, -62%); }
        50% { transform: translate(-50%, -74%); }
      }

      .boot-bubble {
        position: absolute;
        bottom: -20px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, rgba(247, 244, 237, 0.85), rgba(247, 244, 237, 0.25));
        opacity: 0;
        animation: bootRise linear infinite;
      }

      @keyframes bootRise {
        0% { transform: translateY(0) translateX(0); opacity: 0; }
        12% { opacity: 0.85; }
        85% { opacity: 0.5; }
        100% { transform: translateY(-105vh) translateX(24px); opacity: 0; }
      }

      .boot-wave {
        position: absolute;
        left: 0;
        bottom: -2px;
        width: 200%;
        height: 120px;
        animation: bootWaveSlide linear infinite;
      }

      .boot-wave.w1 { animation-duration: 7s; opacity: 0.55; }
      .boot-wave.w2 { animation-duration: 11s; opacity: 0.35; animation-direction: reverse; }

      @keyframes bootWaveSlide {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }

      .boot-content {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 0 20px;
        margin-top: 24vh;
      }

      .boot-title {
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(2rem, 6vw, 3.2rem);
        font-weight: 700;
        letter-spacing: 0;
        color: #F7F4ED;
      }

      .boot-subtitle {
        margin: 10px 0 0;
        font-size: clamp(0.75rem, 2.4vw, 0.95rem);
        letter-spacing: 0.5px;
        color: rgba(247, 244, 237, 0.62);
      }

      .boot-bar {
        width: min(280px, 60vw);
        height: 5px;
        margin: 26px auto 0;
        border-radius: 999px;
        background: rgba(247, 244, 237, 0.15);
        overflow: hidden;
        position: relative;
      }

      .boot-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 999px;
        background: #0C6E5E;
        animation: bootLoadSlide 1.2s ease-in-out infinite;
      }

      @keyframes bootLoadSlide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
    </style>
  </head>

  <body>

    <div id="boot-loader">
      <div class="boot-ocean">
        <div class="boot-glow"></div>
        <div class="boot-sonar s1"></div>
        <div class="boot-sonar s2"></div>
        <div class="boot-sonar s3"></div>
        <div class="boot-pin">📍</div>
        <div id="boot-bubbles"></div>
        <svg class="boot-wave w1" viewBox="0 0 2880 120" preserveAspectRatio="none">
          <path
            d="M0,64 q72,-36 144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 V120 H0 Z"
            fill="rgba(12, 110, 94, 0.5)"
          />
        </svg>
        <svg class="boot-wave w2" viewBox="0 0 2880 120" preserveAspectRatio="none">
          <path
            d="M0,72 q72,-28 144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 t144,0 V120 H0 Z"
            fill="rgba(247, 244, 237, 0.16)"
          />
        </svg>
      </div>
      <div class="boot-content">
        <h1 class="boot-title">OceanEmbed</h1>
        <p class="boot-subtitle">Diving into marine intelligence</p>
        <div class="boot-bar"></div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Scatter rising bubbles across the boot ocean
      (function () {
        const holder = document.getElementById("boot-bubbles");
        if (!holder) return;
        const seeds = [4, 12, 21, 33, 45, 52, 63, 71, 80, 88, 95, 27, 58, 8];
        seeds.forEach((left, i) => {
          const b = document.createElement("span");
          b.className = "boot-bubble";
          const size = 5 + ((i * 7) % 12);
          b.style.left = left + "%";
          b.style.width = size + "px";
          b.style.height = size + "px";
          b.style.animationDuration = 3.5 + ((i * 13) % 40) / 10 + "s";
          b.style.animationDelay = ((i * 17) % 30) / 10 + "s";
          holder.appendChild(b);
        });
      })();

      /*
       * React calls this immediately when it is ready
       * to take over the screen.
       */
      window.finishOceanBootLoader = () => {
        const loader = document.getElementById("boot-loader");

        if (!loader) return;

        loader.classList.add("boot-hidden");

        setTimeout(() => {
          loader.remove();
        }, 850);
      };
    </script>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
